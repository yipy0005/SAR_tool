[workspace]
name = "sar-workbench"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
python = "==3.12.14"
flask = "==3.1.1"
pytest = "==8.4.1"
rdkit = "==2026.03.3"
gunicorn = "==23.0.0"
psycopg = "==3.3.4"

[tasks]
start = "python app.py"
local = "python scripts/setup_local.py --start"
setup-local = "python scripts/setup_local.py"
start-local = "python scripts/setup_local.py --start-existing"
test = "python -m pytest -q"
db-init = "python manage.py init-db"
db-check = "python manage.py check-db"
fetch-ketcher = "python scripts/fetch_ketcher.py"
